services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    profiles:
      - "core"
      - "data"
      - "trading"
      - "mock-trading"

  market_poller:
    build:
      context: .
      dockerfile: services/market_poller/Dockerfile
    env_file:
      - .env
      - .env.data
    environment:
      - REDIS_HOST=redis
      - INITIAL_POLLING_INTERVAL_S=15
      - POLLING_INTERVAL_S=60
      - ENABLE_BULK_LOAD=true
    depends_on:
      - redis
    profiles:
      - "data"
      - "mock-trading"

  market_similarity:
    build:
      context: .
      dockerfile: services/market_similarity/Dockerfile
    env_file:
      - .env
      - .env.data
    environment:
      - REDIS_HOST=redis
      - SIMILARITY_POLLING_INTERVAL_S=5
      - WAIT_FOR_MARKET_POLLER=true
      - SIMILARITY_THRESHOLD=0.7
    depends_on:
      - redis
      - market_poller
    profiles:
      - "data"
      - "mock-trading"

  arbitrage_finder:
    build:
      context: .
      dockerfile: services/arbitrage_finder/Dockerfile
    env_file:
      - .env
      - .env.trading
    environment:
      - REDIS_HOST=redis
      - ARBITRAGE_POLLING_INTERVAL_S=5
    depends_on:
      - redis
      - market_similarity
    profiles:
      - "trading"
      - "mock-trading"
  
  trade_executor:
    build:
      context: .
      dockerfile: services/trade_executor/Dockerfile
    env_file:
      - .env
      - .env.trading
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    profiles:
      - "trading"

  mock_trade_executor:
    build:
      context: .
      dockerfile: services/mock_trade_executor/Dockerfile
    env_file:
      - .env
      - .env.trading
    depends_on:
      - redis
      - arbitrage_finder
    profiles:
      - "mock-trading"
    environment:
      - REDIS_HOST=redis
      - MOCK_EXECUTION_DELAY_S=1.0
      - MOCK_TRADE_POLLING_INTERVAL_S=5

volumes:
  redis-data: 